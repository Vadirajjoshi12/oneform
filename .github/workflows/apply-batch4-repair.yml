name: Repair and apply Batch 4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Batch 4: live sync') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original modal and add live sync
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import re

          path = Path('frontend/src/components/PoolDetailModal.tsx')
          original = subprocess.check_output(
              ['git', 'cat-file', 'blob', '3c8028cadccbb504aff0768e0c7b76ab34886a05'],
              text=True,
          )

          pattern = r"  useEffect\(\(\) => \{\n    if \(pool\?\.id && onRefreshPoolDetails\) \{\n      onRefreshPoolDetails\(pool\.id\)\.catch\(\(\) => \{\}\);\n    \}\n  \}, \[pool\?\.id\]\);"
          replacement = '''  // Batch 4: keep the open pool synchronized with backend changes.
  useEffect(() => {
    if (!pool?.id || !onRefreshPoolDetails) return;

    let cancelled = false;

    const refresh = async () => {
      if (cancelled) return;
      try {
        await onRefreshPoolDetails(pool.id);
      } catch (err) {
        console.warn('Live pool sync failed:', err);
      }
    };

    // Refresh immediately, then poll every 3 seconds while this pool is open.
    refresh();
    const intervalId = window.setInterval(refresh, 3000);

    return () => {
      cancelled = true;
      window.clearInterval(intervalId);
    };
  }, [pool?.id, onRefreshPoolDetails]);'''

          patched, count = re.subn(pattern, replacement, original, count=1)
          if count != 1:
              raise SystemExit('Could not find the original refresh effect in the known-good file.')
          if 'window.setInterval(refresh, 3000)' not in patched:
              raise SystemExit('Live sync validation failed.')
          if 'return (' not in patched:
              raise SystemExit('Modal restoration validation failed.')

          path.write_text(patched, encoding='utf-8')
          print('Restored full PoolDetailModal and applied Batch 4 live sync.')

      - name: Commit final source and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/PoolDetailModal.tsx
          git rm .github/workflows/apply-batch4-repair.yml
          git commit -m 'Batch 4: live sync'
          git push
