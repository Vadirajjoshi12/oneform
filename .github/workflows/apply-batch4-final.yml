name: Apply Batch 4 final live sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Batch 4: live sync') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch PoolDetailModal
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('frontend/src/components/PoolDetailModal.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = r"  useEffect\(\(\) => \{\n    if \(pool\?\.id && onRefreshPoolDetails\) \{\n      onRefreshPoolDetails\(pool\.id\)\.catch\(\(\) => \{\}\);\n    \}\n  \}, \[pool\?\.id\]\);"

          replacement = '''  // Batch 4: keep the open pool synchronized with backend changes.
  useEffect(() => {
    if (!pool?.id || !onRefreshPoolDetails) return;

    let cancelled = false;

    const refresh = async () => {
      if (cancelled) return;
      try {
        await onRefreshPoolDetails(pool.id);
      } catch (err) {
        console.warn('Live pool sync failed:', err);
      }
    };

    // Refresh immediately, then poll every 3 seconds while this pool is open.
    refresh();
    const intervalId = window.setInterval(refresh, 3000);

    return () => {
      cancelled = true;
      window.clearInterval(intervalId);
    };
  }, [pool?.id, onRefreshPoolDetails]);'''

          patched, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected one-time pool refresh effect was not found; no changes made.')

          path.write_text(patched, encoding='utf-8')
          print('Batch 4 live sync applied successfully.')

      - name: Commit real fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/PoolDetailModal.tsx .github/workflows/apply-batch4-final.yml
          git commit -m 'Batch 4: live sync'
          git rm .github/workflows/apply-batch4-final.yml
          git commit -m 'Batch 4: remove temporary patch workflow'
          git push
